name: Build and Upload Release APK

on:
  release:
    types: [published]
  push: # Optional: Runs tests on pushes to main to catch errors early
    branches: [main]

jobs:
  # --- NEW JOB: Runs Unit, Widget, and Integration Tests ---
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./nutricode

      # 1. Run Standard Unit and Widget Tests
      - name: Run Unit & Widget Tests
        run: flutter test
        working-directory: ./nutricode

      # 2. Enable KVM Acceleration for Android Emulator
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 3. Spin up Android Emulator and execute integration tests
      - name: Run Integration Tests on Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./nutricode
          script: flutter test integration_test

  # --- EXISTING JOB: Compiles and signs the final release APK ---
  build:
    name: Build APK and Upload
    needs: test # Prevents building/uploading if the tests fail!
    if: github.event_name == 'release' # Only runs when executing a release
    runs-on: ubuntu-latest
        
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./nutricode

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ./nutricode/android/app/upload-keystore.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: "upload-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release
        working-directory: ./nutricode

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
