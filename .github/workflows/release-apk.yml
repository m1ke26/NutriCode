name: Build and Upload Release APK

on:
  release:
    types: [published]

jobs:
  build:
    name: Build APK and Upload
    runs-on: ubuntu-latest
        
    # Required permission to upload assets to a GitHub Release
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Java 17 is standard for modern Android builds

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./nutricode

      # --- NEW STEP: Decodes your keystore file securely ---
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ./nutricode/android/app/upload-keystore.jks

      # --- UPDATED STEP: Added environment variables ---
      - name: Build Release APK
        env:
          KEYSTORE_PATH: "upload-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release
        working-directory: ./nutricode

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
